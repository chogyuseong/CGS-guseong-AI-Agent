      mail_messages:
        - id: 19b0000000000301
          sender: 택배알림 <noreply@example.com>
          subject: 택배 도착 안내
          received: "2026-11-18T07:30:00+09:00"
          body: 고객님의 택배가 오늘 오후 2시에서 4시 사이에 도착합니다.
        - id: 19b0000000000302
          sender: 김민지 <minji@example.com>
          subject: 토요일 모임 공지
          received: "2026-11-18T08:10:00+09:00"
          body: |-
            이번 주 토요일 모임은 성수동에서 저녁 6시에 만나요.

