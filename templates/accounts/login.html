{% extends "base.html" %}
{% block title %}로그인 · 마이에이전트{% endblock %}
{% block body %}
<main class="flex min-h-dvh items-center justify-center px-4">
  <form method="post" class="w-full max-w-sm space-y-4">
    {% csrf_token %}
    <h1 class="text-center text-2xl font-bold">마이에이전트</h1>
    {% if form.errors %}
      <p class="rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950 dark:text-red-300">아이디 또는 비밀번호가 맞지 않습니다.</p>
    {% endif %}
    <div class="space-y-1">
      <label for="id_username" class="block text-sm font-medium">아이디</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus
             class="h-12 w-full rounded-xl border border-neutral-300 bg-transparent px-3 dark:border-neutral-700">
    </div>
    <div class="space-y-1">
      <label for="id_password" class="block text-sm font-medium">비밀번호</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required
             class="h-12 w-full rounded-xl border border-neutral-300 bg-transparent px-3 dark:border-neutral-700">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="h-12 w-full rounded-xl bg-blue-600 font-semibold text-white">로그인</button>
  </form>
</main>
{% endblock %}
