{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  {# viewport-fit=cover: 아이폰 홈 바 영역까지 그린 뒤 safe-area-inset으로 여백을 준다 #}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="마이에이전트">
  <title>{% block title %}마이에이전트{% endblock %}</title>
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
</head>
{# HTMX 요청에도 CSRF 토큰이 붙도록 body에 헤더를 지정한다 #}
<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
  <script>
    // 서비스 워커 등록: 홈 화면 앱(PWA)과 푸시 수신에 필요하다. 등록만으로는 알림 권한을 묻지 않는다.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
